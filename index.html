<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Josh Bleskacek Portfolio</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" type="image/png" href="./Logo.png">
</head>
<body>
  <main>
    <div class="toolbar">
      <div class="brand">
        <img class="brand-logo" src="./Logo.png" alt="Portfolio logo">
        <span class="brand-name">Josh Bleskacek</span>
      </div>
      <div class="download-actions">
        <a class="download-link" href="./Portfolio.pdf" download>Download Portfolio</a>
        <a class="download-link" href="./Resume.pdf" download>Download Resume</a>
      </div>
    </div>
    <iframe
        src="./Portfolio.pdf"
      title="Portfolio PDF"
      aria-label="Embedded portfolio PDF">
      <p>Unable to display the PDF. <a href="./Portfolio.pdf">Open the portfolio PDF</a>.</p>
    </iframe>
  </main>
</body>
</html>
